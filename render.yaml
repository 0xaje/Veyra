services:
  - type: web
    name: veyra
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check && mkdir -p .render && git clone --depth 1 https://github.com/MystenLabs/sui-apis.git .render/sui-apis && test -f .render/sui-apis/proto/sui/rpc/v2/ledger_service.proto
    startCommand: node --experimental-strip-types scripts/preflight-api.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: VEYRA_PUBLIC_MODE
        value: "true"
      - key: MEMWAL_PRIVATE_KEY
        sync: false
      - key: MEMWAL_ACCOUNT_ID
        sync: false
      - key: MEMWAL_NAMESPACE
        value: veyra-dev
      - key: SUI_PROTO_DIR
        value: .render/sui-apis/proto
      - key: TATUM_API_KEY
        sync: false
