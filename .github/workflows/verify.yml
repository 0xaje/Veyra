name: Verify product
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check scripts/preflight-api.mjs
      - run: node --check scripts/live-readonly-preflight.mjs
      - run: node --check scripts/private-relationships-api.mjs
      - run: node --check apps/web/relationships.js
      - run: npm test
