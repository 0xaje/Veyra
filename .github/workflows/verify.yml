name: Verify product
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veyra_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veyra_tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check scripts/preflight-api.mjs
      - run: node --check scripts/live-readonly-preflight.mjs
      - run: node --check scripts/private-relationships-api.mjs
      - run: node --check scripts/saved-assessments-api.mjs
      - run: node --check apps/web/saved-checks.js
      - run: node --check apps/web/relationships.js
      - run: npm test
